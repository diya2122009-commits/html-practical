Assignment 27
Create three differently styled card variants using border-radius and backgrounds.
<!DOCTYPE html>
<html>
<head>
    <title>Card Variants</title>
 
    <style>
        .card {
            width: 250px;
            padding: 15px;
            margin: 15px;
            color: white;
            border-radius: 15px;
        }
 
        .card1 {
            background-color: #3498db;
        }
 
        .card2 {
            background-color: #2ecc71;
            border-radius: 25px;
        }
 
        .card3 {
            background-color: #e74c3c;
            border-radius: 40px;
        }
    </style>
</head>
<body>
 
    <div class="card card1">
        <h2>Card 1</h2>
        <p>Blue Card</p>
    </div>
 
    <div class="card card2">
        <h2>Card 2</h2>
        <p>Green Card</p>
    </div>
 
    <div class="card card3">
        <h2>Card 3</h2>
        <p>Red Card</p>
    </div>
 
</body>
</html>
