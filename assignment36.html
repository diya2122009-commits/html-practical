Build a simple photo gallery using CSS Grid<!DOCTYPE html>
<html>
<head>
<title>Photo Gallery</title>
 
<style>
.gallery{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:10px;
}
 
.item{
background:lightgray;
padding:50px;
text-align:center;
}
</style>
 
</head>
<body>
 
<div class="gallery">
    <div class="item">Photo 1</div>
    <div class="item">Photo 2</div>
    <div class="item">Photo 3</div>
    <div class="item">Photo 4</div>
    <div class="item">Photo 5</div>
    <div class="item">Photo 6</div>
</div>
 
</body>
</html>
