Create 43-grid-and-flex-landing
<!DOCTYPE html>
<html>
<head>
<style>
nav{
display:flex;
justify-content:space-around;
background:navy;
padding:15px;
}
 
nav a{
color:white;
text-decoration:none;
}
 
.grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:10px;
margin-top:20px;
}
 
.box{
background:lightgray;
padding:30px;
text-align:center;
}
</style>
</head>
<body>
 
<nav>
<a href="#">Home</a>
<a href="#">About</a>
<a href="#">Contact</a>
</nav>
 
<div class="grid">
<div class="box">Box 1</div>
<div class="box">Box 2</div>
<div class="box">Box 3</div>
</div>
 
</body>
</html>
