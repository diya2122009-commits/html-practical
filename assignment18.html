Assignment 18 

Build an e-commerce style product size chart table

<!DOCTYPE html>
<html>
<head>
    <title>Product Size Chart</title>
</head>
<body>
 
    <h1>T-Shirt Size Chart</h1>
 
    <table border="1">
        <tr>
            <th>Size</th>
            <th>Chest (inches)</th>
            <th>Length (inches)</th>
        </tr>
 
        <tr>
            <td>S</td>
            <td>36</td>
            <td>26</td>
        </tr>
 
        <tr>
            <td>M</td>
            <td>40</td>
            <td>28</td>
        </tr>
 
        <tr>
            <td>L</td>
            <td>44</td>
            <td>30</td>
        </tr>
 
        <tr>
            <td>XL</td>
            <td>48</td>
            <td>32</td>
        </tr>
    </table>
 
</body>
</html>
