Assignment 24 
Create a small design-token stylesheet (colors, font sizes) using CSS variables.
<!DOCTYPE html>
<html>
<head>
    <title>Design Tokens</title>
 
    <style>
        :root {
            --primary-color: #3498db;
            --secondary-color: #2c3e50;
            --font-size: 18px;
        }
 
        h1 {
            color: var(--primary-color);
        }
 
        p {
            color: var(--secondary-color);
            font-size: var(--font-size);
        }
    </style>
</head>
<body>
 
    <h1>Design Tokens Example</h1>
 
    <p>
        This page uses CSS variables for colors and font size.
    </p>
 
</body>
</html>
