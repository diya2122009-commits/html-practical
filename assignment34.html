Assignment 34 
Build a Responsive Navbar + Hero Section using Flexbox
<!DOCTYPE html>
<html>
<head>
    <title>Flex Navbar Hero</title>
 
    <style>
        nav{
            display:flex;
            justify-content:space-between;
            background:navy;
            padding:15px;
            color:white;
        }
 
        .hero{
            display:flex;
            justify-content:center;
            align-items:center;
            height:300px;
            background:lightblue;
        }
    </style>
</head>
<body>
 
    <nav>
        <div>Logo</div>
        <div>Home About Contact</div>
    </nav>
 
    <div class="hero">
        <h1>Welcome to My Website</h1>
    </div>
 
</body>
</html>
