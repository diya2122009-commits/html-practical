<!DOCTYPE html>
<html>
<head>
<style>
.container{
display:grid;
grid-template-areas:
"header header"
"sidebar main";
grid-template-columns:200px 1fr;
gap:10px;
}
 
.header{grid-area:header;background:skyblue;padding:20px;}
.sidebar{grid-area:sidebar;background:lightgray;padding:20px;}
.main{grid-area:main;background:lightgreen;padding:20px;}
</style>
</head>
<body>
 
<div class="container">
<div class="header">Header</div>
<div class="sidebar">Sidebar</div>
<div class="main">Main Content</div>
</div>
 
</body>
</html>
