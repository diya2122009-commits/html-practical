Assignment 22 
Style a page using at least four different selector types correctly.
<!DOCTYPE html>
<html>
<head>
    <title>CSS Selectors</title>
 
    <style>
        /* Element Selector */
        h1 {
            color: blue;
        }
 
        /* Class Selector */
        .highlight {
            color: green;
        }
 
        /* ID Selector */
        #special {
            background-color: yellow;
        }
 
        /* Universal Selector */
        * {
            font-family: Arial;
        }
    </style>
</head>
<body>
 
    <h1>CSS Selectors Example</h1>
 
    <p class="highlight">This uses a class selector.</p>
 
    <p id="special">This uses an ID selector.</p>
 
    <p>This is a normal paragraph.</p>
 
</body>
</html>
