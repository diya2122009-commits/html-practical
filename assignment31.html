Assignment 31 
Create a simple responsive menu bar using Flexbox.
<!DOCTYPE html>
<html>
<head>
    <title>Flex Menu Bar</title>
 
    <style>
        nav{
            display:flex;
            justify-content:space-around;
            background:rgb(240, 133, 185);
            padding:15px;
        }
 
        nav a{
            color:rgb(7, 64, 79);
            text-decoration:none;
        }
    </style>
</head>
<body>
 
    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Services</a>
        <a href="#">Contact</a>
    </nav>
 
</body>
</html>
