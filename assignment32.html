Assignment 32 
Create a perfectly centered login form using Flexbox.
<!DOCTYPE html>
<html>
<head>
    <title>Centered Login</title>
 
    <style>
        body{
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }
 
        .login{
            border:1px solid #ccc;
            padding:20px;
        }
    </style>
</head>
<body>
 
    <div class="login">
        <h2>Login</h2>
 
        <input type="text" placeholder="Username"><br><br>
 
        <input type="password" placeholder="Password"><br><br>
 
        <button>Login</button>
    </div>
 
</body>
</html>
