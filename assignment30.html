<!DOCTYPE html>
<html>
<head>
    <title>Profile Card</title>
 
    <style>
        .card{
            width:250px;
            padding:20px;
            border:1px solid #ccc;
            border-radius:15px;
            text-align:center;
            background:#f8f8f8;
        }
 
        img{
            width:100px;
            border-radius:50%;
        }
    </style>
</head>
<body>
 
    <div class="card">
        <img src="https://via.placeholder.com/100" alt="Profile">
 
        <h2>Diya Gupta</h2>
 
        <p>Web Development Student</p>
 
        <button>Contact</button>
    </div>
 
</body>
</html>
