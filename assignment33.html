Assignment 33 
Build a product-listing style layout using flex-wrap.
<!DOCTYPE html>
<html>
<head>
    <title>Product Listing</title>
 
    <style>
        .container{
            display:flex;
            flex-wrap:wrap;
            gap:10px;
        }
 
        .product{
            width:150px;
            border:1px solid black;
            padding:10px;
        }
    </style>
</head>
<body>
 
    <div class="container">
 
        <div class="product">
            <h3>Product 1</h3>
            <p>₹100</p>
        </div>
 
        <div class="product">
            <h3>Product 2</h3>
            <p>₹200</p>
        </div>
 
        <div class="product">
            <h3>Product 3</h3>
            <p>₹300</p>
        </div>
 
        <div class="product">
            <h3>Product 4</h3>
            <p>₹400</p>
        </div>
 
    </div>
 
</body>
</html>
